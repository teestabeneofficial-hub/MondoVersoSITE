<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#FF6600">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/mv.css">
<title>Il mio profilo | MondoVERSO</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
</head>
<body data-page="account">
<div data-mv-top></div>
<main class="section"><div class="wrap" style="max-width:980px">
  <h1 style="font-size:clamp(36px,5vw,56px)">Il mio profilo</h1>
  <div style="margin-top:26px"><div class="panel" id="loginBox"><h2 style="font-size:26px">Entra o crea il tuo profilo</h2><p class="small" style="margin-top:8px">Con la password, oppure con un link che ti mandiamo per email.</p><form class="form" id="loginForm" novalidate><div class="form-grid"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" autocomplete="current-password" placeholder="vuota per il link via email"></label></div><div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn btn-ink" type="submit" data-mode="login">Entra</button><button class="btn btn-line" type="submit" data-mode="signup">Crea il profilo</button><button class="btn btn-line" type="submit" data-mode="link">Mandami il link</button></div><p class="form-msg" id="loginMsg" role="status" aria-live="polite"></p></form></div></div>
  <div id="profile" hidden>
    <p class="lead" style="margin-top:12px">Sei entrato come <b id="pEmail"></b>. <button class="btn btn-line btn-small" type="button" id="logout">Esci</button></p>
    <section class="panel" style="margin-top:22px"><h2 style="font-size:28px">La mia mappa del mondo</h2><p class="small" id="visitCount" style="margin-top:6px"></p>
      <form class="form" id="visitForm" style="margin:12px 0"><div style="display:flex;gap:10px;flex-wrap:wrap"><label class="visually-hidden" for="visitCity">Città visitata</label><input type="text" id="visitCity" placeholder="Aggiungi una città, es. Porto" style="flex:1;min-width:220px"><button class="btn btn-ink" type="submit">Aggiungi</button></div><p class="form-msg small" id="visitMsg" role="status"></p></form>
      <div class="map" id="map"></div><div class="chips" id="visitList" style="margin-top:12px"></div></section>
    <section class="panel" style="margin-top:22px"><h2 style="font-size:28px">I miei racconti</h2><ul id="myStories" style="padding-left:1.1em;margin:12px 0 0"></ul><p style="margin-top:14px"><a class="btn btn-orange" href="/racconta">Racconta un weekend</a></p></section>
  </div>
</div></main>
<div data-mv-foot></div>
<script src="/assets/mv.js"></script>
</body>
</html>
